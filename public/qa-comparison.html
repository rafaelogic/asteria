<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Asteria visual QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #05080b; color: #edf4f8; font: 14px system-ui; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; color: #8eeaff; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid #23313c; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Selected reference</figcaption><img src="/qa-reference.png" alt="Selected Asteria reference design" /></figure>
      <figure><figcaption>Rendered implementation</figcaption><img src="/qa-implementation.png" alt="Rendered Asteria implementation" /></figure>
    </main>
  </body>
</html>
