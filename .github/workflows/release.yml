name: protected-production-release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  credential-gate:
    runs-on: ubuntu-latest
    environment: production-release
    env:
      GH_CLIENT: ${{ vars.ASTERIA_GITHUB_CLIENT_ID }}
      APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
      WIN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Require live OAuth, notarization, and signing credentials
        run: |
          test -n "$GH_CLIENT"
          test -n "$APPLE_ID_VALUE"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM"
          test -n "$WIN_CERT"
          test -n "$WIN_PASSWORD"

  live-contracts:
    needs: credential-gate
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:privacy
      - run: npm run test:release
      - name: Protected live GitHub and Claude contract gates
        run: node scripts/protected-live-gates.mjs
        env:
          ASTERIA_GITHUB_CLIENT_ID: ${{ vars.ASTERIA_GITHUB_CLIENT_ID }}
          ASTERIA_REQUIRE_LIVE_CLAUDE: "1"

  package:
    needs: live-contracts
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.ASTERIA_GITHUB_CLIENT_ID }}
      - name: Native Electron smoke acceptance
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Native Electron smoke acceptance
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - run: npm run patch:packager
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Generate checksums, SBOM, privacy report, test summary, and provenance
        run: node scripts/release-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: asteria-${{ matrix.target }}-release-candidate
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/release-evidence/**
          if-no-files-found: error
